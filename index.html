<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M's Pottery</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f8f5f2;
      overflow: hidden;
    }
    .floating-gallery,
    .floating-sub-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      padding: 40px;
      width: 100vw;
      box-sizing: border-box;
      background: #f8f5f2;
      overflow-y: auto;
      height: 100vh;
      justify-items: center;
      align-items: center;
    }
    .floating-image {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 336px;
      height: auto;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: transform 0.2s, z-index 0.2s;
      animation-duration: 8s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    .floating-image:hover {
      transform: scale(1.12);
      z-index: 2;
    }
    .float1 { animation-name: float1;}
    .float2 { animation-name: float2;}
    .float3 { animation-name: float3;}
    @keyframes float1 {
      0% { transform: translate(0, 0) scale(1);}
      20% { transform: translate(30px, -32px) scale(1.08);}
      50% { transform: translate(-40px, 25px) scale(1.12);}
      80% { transform: translate(24px, 40px) scale(1.07);}
      100% { transform: translate(0, 0) scale(1);}
    }
    @keyframes float2 {
      0% { transform: translate(0, 0) scale(1);}
      25% { transform: translate(-28px, 24px) scale(1.06);}
      50% { transform: translate(32px, -42px) scale(1.09);}
      75% { transform: translate(-30px, 38px) scale(1.10);}
      100% { transform: translate(0, 0) scale(1);}
    }
    @keyframes float3 {
      0% { transform: translate(0, 0) scale(1);}
      30% { transform: translate(45px, -18px) scale(1.13);}
      60% { transform: translate(-35px, 46px) scale(1.08);}
      100% { transform: translate(0, 0) scale(1);}
    }
    .back-button {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
      display: none;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: #7b4e2d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .back-button.visible {
      display: inline-block !important;
    }
    @media (max-width: 600px) {
      .floating-gallery,
      .floating-sub-gallery {
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
        gap: 12px;
        padding: 12px;
      }
      .floating-image {
        max-width: 70px;
      }
    }
  </style>
</head>
<body>
  <button class="back-button" id="backButton" style="display: none;">Back</button>
  <div class="floating-gallery" id="mainGallery"></div>
  <div id="pagination"></div>
  
  <!-- Sub galleries: keep your current markup for .floating-sub-gallery as-is! -->

  <script>
    // ==== PAGINATED MAIN GALLERY ====
    const IMAGES_PER_PAGE = 9;
    const imageFiles = [
      "pot1a.jpg", "pot2a.jpg", "pot3a.jpg", "pot4a.jpg", "pot5a.jpg", "pot6a.jpg",
      "pot7a.jpg", "pot8a.jpg", "pot9a.jpg", "pot10a.jpg", "pot11a.jpg", "pot12a.jpg",
      "pot13a.jpg", "pot14a.jpg", "pot15a.jpg", "pot17a.jpg", "pot18a.jpg", "pot19a.jpg",
      "pot20a.jpg", "pot21a.jpg", "pot22a.jpg", "pot23a.jpg", "pot24a.jpg"
    ];
    const mainGallery = document.getElementById('mainGallery');
    const pagination = document.getElementById('pagination');
    const backButton = document.getElementById('backButton');
    const subGalleries = document.querySelectorAll('.floating-sub-gallery');
    let currentPage = 1;
    const totalPages = Math.ceil(imageFiles.length / IMAGES_PER_PAGE);

    function renderGallery(page) {
      mainGallery.innerHTML = '';
      const start = (page - 1) * IMAGES_PER_PAGE;
      const end = Math.min(start + IMAGES_PER_PAGE, imageFiles.length);
      for (let i = start; i < end; i++) {
        const img = document.createElement('img');
        img.src = imageFiles[i];
        img.alt = `pot${i+1}`;
        img.className = `floating-image float${(i%3)+1}`;
        img.setAttribute('data-group', `${i+1}`);
        img.loading = 'lazy';
        img.addEventListener('click', () => openSubGallery(img.getAttribute('data-group')));
        mainGallery.appendChild(img);
      }
      renderPagination();
      mainGallery.style.display = 'grid';
      pagination.style.display = '';
      backButton.classList.remove('visible');
      subGalleries.forEach(gallery => gallery.style.display = 'none');
    }

    function renderPagination() {
      pagination.innerHTML = '';
      if (currentPage > 1) {
        const prevBtn = document.createElement('button');
        prevBtn.textContent = 'Previous';
        prevBtn.onclick = () => { currentPage--; renderGallery(currentPage); };
        pagination.appendChild(prevBtn);
      }
      if (currentPage < totalPages) {
        const nextBtn = document.createElement('button');
        nextBtn.textContent = 'Next';
        nextBtn.onclick = () => { currentPage++; renderGallery(currentPage); };
        pagination.appendChild(nextBtn);
      }
      // Page indicator
      const pageInfo = document.createElement('span');
      pageInfo.textContent = ` Page ${currentPage} of ${totalPages} `;
      pagination.appendChild(pageInfo);
    }

    // ==== SUB-GALLERY LOGIC ====
    function openSubGallery(group) {
      mainGallery.style.display = 'none';
      pagination.style.display = 'none';
      subGalleries.forEach(gallery => {
        if (gallery.getAttribute('data-group') === group) {
          gallery.style.display = 'grid';
        } else {
          gallery.style.display = 'none';
        }
      });
      backButton.classList.add('visible');
    }

    backButton.addEventListener('click', () => {
      renderGallery(currentPage);
    });

    // Initial render
    renderGallery(currentPage);
  </script>
</body>
</html>
