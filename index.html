<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M's Pottery</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f8f5f2;
      overflow: hidden;
    }
    .floating-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      padding: 40px;
      width: 100vw;
      box-sizing: border-box;
      background: #f8f5f2;
      overflow-y: auto;
      height: 100vh;
      justify-items: center;
      align-items: center;
    }
    .floating-image {
      position: relative;  /* Allows overlap with transform */
      z-index: 1;
      width: 100%;
      max-width: 336px;
      height: auto;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: transform 0.2s, z-index 0.2s;
      animation-duration: 8s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    .floating-image:hover {
      transform: scale(1.12);
      z-index: 2;
    }
    /* Overlap by allowing larger translations */
    .float1 { animation-name: float1;}
    .float2 { animation-name: float2;}
    .float3 { animation-name: float3;}
    @keyframes float1 {
      0% { transform: translate(0, 0) scale(1);}
      20% { transform: translate(30px, -32px) scale(1.08);}
      50% { transform: translate(-40px, 25px) scale(1.12);}
      80% { transform: translate(24px, 40px) scale(1.07);}
      100% { transform: translate(0, 0) scale(1);}
    }
    @keyframes float2 {
      0% { transform: translate(0, 0) scale(1);}
      25% { transform: translate(-28px, 24px) scale(1.06);}
      50% { transform: translate(32px, -42px) scale(1.09);}
      75% { transform: translate(-30px, 38px) scale(1.10);}
      100% { transform: translate(0, 0) scale(1);}
    }
    @keyframes float3 {
      0% { transform: translate(0, 0) scale(1);}
      30% { transform: translate(45px, -18px) scale(1.13);}
      60% { transform: translate(-35px, 46px) scale(1.08);}
      100% { transform: translate(0, 0) scale(1);}
    }
    @media (max-width: 600px) {
      .floating-gallery {
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
        gap: 12px;
        padding: 12px;
      }
      .floating-image {
        max-width: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="floating-gallery" id="mainGallery">
    <img src="pot1a.jpg" alt="pot1" class="floating-image float1" loading="lazy" />
    <img src="pot2a.jpg" alt="pot2" class="floating-image float2" loading="lazy" />
    <img src="pot3a.jpg" alt="pot3" class="floating-image float3" loading="lazy" />
    <img src="pot4a.jpg" alt="pot4" class="floating-image float1" loading="lazy" />
    <img src="pot5a.jpg" alt="pot5" class="floating-image float2" loading="lazy" />
    <img src="pot6a.jpg" alt="pot6" class="floating-image float3" loading="lazy" />
    <img src="pot7a.jpg" alt="pot7" class="floating-image float1" loading="lazy" />
    <img src="pot8a.jpg" alt="pot8" class="floating-image float2" loading="lazy" />
    <img src="pot9a.jpg" alt="pot9" class="floating-image float3" loading="lazy" />
    <img src="pot10a.jpg" alt="pot10" class="floating-image float1" loading="lazy" />
    <img src="pot11a.jpg" alt="pot11" class="floating-image float2" loading="lazy" />
    <img src="pot12a.jpg" alt="pot12" class="floating-image float3" loading="lazy" />
    <img src="pot13a.jpg" alt="pot13" class="floating-image float1" loading="lazy" />
    <img src="pot14a.jpg" alt="pot14" class="floating-image float2" loading="lazy" />
    <img src="pot15a.jpg" alt="pot15" class="floating-image float3" loading="lazy" />
    <img src="pot17a.jpg" alt="pot17" class="floating-image float1" loading="lazy" />
    <img src="pot18a.jpg" alt="pot18" class="floating-image float2" loading="lazy" />
    <img src="pot19a.jpg" alt="pot19" class="floating-image float3" loading="lazy" />
    <img src="pot20a.jpg" alt="pot20" class="floating-image float1" loading="lazy" />
    <img src="pot21a.jpg" alt="pot21" class="floating-image float2" loading="lazy" />
    <img src="pot22a.jpg" alt="pot22" class="floating-image float3" loading="lazy" />
    <img src="pot23a.jpg" alt="pot23" class="floating-image float1" loading="lazy" />
    <img src="pot24a.jpg" alt="pot24" class="floating-image float2" loading="lazy" />
  </div>

  <!-- Repeat sub-galleries for other groups (2-24) as in your original file, using float1/2/3 classes in a pattern -->

  <script>
    const mainGallery = document.getElementById('mainGallery');
    const subGalleries = document.querySelectorAll('.floating-sub-gallery');
    const backButton = document.getElementById('backButton');

    // Gallery switching logic
    mainGallery.querySelectorAll('img').forEach(img => {
      img.addEventListener('click', () => {
        const group = img.getAttribute('data-group');
        mainGallery.style.display = 'none';
        const subGallery = document.querySelector(`.floating-sub-gallery[data-group="${group}"]`);
        subGallery.style.display = 'block';
        backButton.classList.add('visible');
      });
    });

    backButton.addEventListener('click', () => {
      subGalleries.forEach(gallery => {
        gallery.style.display = 'none';
      });
      mainGallery.style.display = 'block';
      backButton.classList.remove('visible');
    });

    // Zoom functionality for sub-gallery images
    document.querySelectorAll('.floating-sub-gallery img').forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('zoomImage').src = img.src;
        document.getElementById('zoomView').classList.add('show');
        const parentGallery = img.closest('.floating-sub-gallery');
        parentGallery.style.display = 'none';
        document.getElementById('zoomView').setAttribute('data-group', parentGallery.getAttribute('data-group'));
      });
    });

    document.getElementById('zoomBackButton').addEventListener('click', () => {
      const zoomView = document.getElementById('zoomView');
      const zoomGroup = zoomView.getAttribute('data-group');
      if (zoomGroup) {
        const subGallery = document.querySelector(`.floating-sub-gallery[data-group="${zoomGroup}"]`);
        if (subGallery) subGallery.style.display = 'block';
      }
      zoomView.classList.remove('show');
    });
  </script>
</body>
</html>
